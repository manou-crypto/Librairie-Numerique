[build]
builder = "NIXPACKS"
buildCommand = "cd backend-nestjs && npm install && npm run build"

[deploy]
startCommand = "cd backend-nestjs && npx prisma migrate deploy && node dist/main"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
